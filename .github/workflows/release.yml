name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: node --check dist/airpack-schedule-card.js

      - name: Package dist
        run: |
          cd dist
          zip -r ../airpack-schedule-card.zip airpack-schedule-card.js
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            airpack-schedule-card.zip
            dist/airpack-schedule-card.js
          generate_release_notes: true